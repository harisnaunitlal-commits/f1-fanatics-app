<title>Como ler a Telemetria — vídeo</title>

<style>
  /* 1280x720, deterministic: window.render(t) positions everything for time t (seconds), so every frame can be captured exactly. */
  :root { --bg:#0c0c0e; --red:#e10600; --gold:#f5c518; --green:#4ade80; --redt:#f87171; --purple:#c084fc; --fg:#f0f0f2; --muted:#9a9aa8; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: 'DM Sans', system-ui, sans-serif; }
  .bg { position: absolute; inset: 0; background: radial-gradient(900px 500px at 50% -10%, rgba(225,6,0,.30), transparent 70%), radial-gradient(700px 400px at 100% 110%, rgba(225,6,0,.14), transparent 70%); }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .top { position: absolute; left: 48px; top: 30px; right: 48px; display: flex; align-items: baseline; gap: 14px; }
  .kick { font-family: 'DM Mono'; font-size: 15px; letter-spacing: .16em; color: var(--red); text-transform: uppercase; }
  .ttl { font-family: 'Barlow Condensed'; font-weight: 900; font-size: 46px; text-transform: uppercase; letter-spacing: .01em; line-height: 1; }
  .stage { position: absolute; left: 48px; top: 104px; width: 720px; height: 470px; display: flex; align-items: flex-start; }
  .mock { zoom: 1.35; width: 533px; transform-origin: top left; }
  .steps { position: absolute; left: 800px; top: 104px; width: 432px; display: flex; flex-direction: column; gap: 10px; }
  .step { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 11px 14px; opacity: 0; display: flex; gap: 12px; }
  .step .n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--red); font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .step h4 { font-family: 'Barlow Condensed'; font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--gold); line-height: 1.05; }
  .step p { font-size: 15.5px; color: #dcdce4; line-height: 1.38; margin-top: 2px; }
  .step.cur { background: rgba(245,197,24,.10); border-color: rgba(245,197,24,.55); }
  .cap { position: absolute; left: 0; right: 0; bottom: 0; height: 118px; background: linear-gradient(0deg, rgba(0,0,0,.92), rgba(0,0,0,.0)); display: flex; align-items: flex-end; justify-content: center; padding: 0 90px 26px; }
  .cap span { font-size: 26px; font-weight: 600; line-height: 1.32; text-align: center; text-shadow: 0 2px 8px #000; opacity: 0; max-width: 1100px; }
  .take { position: absolute; left: 48px; width: 720px; background: rgba(245,197,24,.10); border: 1px solid rgba(245,197,24,.45); border-radius: 12px; padding: 10px 16px; font-size: 20px; line-height: 1.3; color: #fdf2c0; opacity: 0; }
  .take b { color: var(--gold); }
  .prog { position: absolute; left: 0; bottom: 0; height: 5px; background: var(--red); width: 0; }
  [data-s].hl { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; background-color: rgba(245,197,24,.16) !important; }
  [data-s].dim { opacity: .55; }

  /* the app's look, redrawn */
  .app { background: #3a3b41; border: 1px solid rgba(255,255,255,.07); border-radius: 12px; overflow: hidden; color: #f0f0f2; }
  .app .t { display: flex; justify-content: space-between; padding: 6px 12px; border-bottom: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.04); font-family: 'Barlow Condensed'; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: #facc15; font-size: 12px; }
  .app .t small { font-family: 'DM Sans'; letter-spacing: 0; text-transform: none; color: #8d8d99; font-weight: 400; font-size: 9px; }
  .app .b { padding: 8px 12px 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 10.5px; }
  th { font-size: 8px; letter-spacing: .08em; text-transform: uppercase; color: #8d8d99; font-weight: 600; padding: 4px 6px; text-align: right; border-bottom: 1px solid rgba(255,255,255,.1); }
  th:first-child, td:first-child, .l { text-align: left; }
  td { padding: 4px 6px; text-align: right; border-bottom: 1px solid rgba(255,255,255,.05); font-variant-numeric: tabular-nums; }
  .car { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; } .car i { width: 3px; height: 13px; border-radius: 2px; display: inline-block; }
  .g { color: var(--green); } .r { color: var(--redt); } .pu { color: var(--purple); font-weight: 800; } .y { color: #fde047; } .gr { color: #8d8d99; }
  .tyre { display: inline-flex; width: 17px; height: 17px; border-radius: 50%; border: 2px solid; align-items: center; justify-content: center; font-size: 8px; font-weight: 900; vertical-align: middle; }
  .S { color: #ef4444; border-color: #ef4444; } .M { color: #facc15; border-color: #facc15; } .H { color: #f4f4f5; border-color: #f4f4f5; } .I { color: #22c55e; border-color: #22c55e; } .W { color: #60a5fa; border-color: #60a5fa; }
  .chip { display: inline-block; font-weight: 900; border-radius: 99px; padding: 3px 12px; font-size: 12px; }
  .live { background: #b91c1c; color: #fff; } .green { background: #16a34a; color: #fff; } .sc { background: #f97316; color: #111; } .vsc { background: #facc15; color: #111; } .redf { background: #dc2626; color: #fff; } .chq { background: #fff; color: #111; }
  .tile { background: rgba(0,0,0,.3); border-radius: 9px; padding: 7px 9px; } .tile .k { font-size: 8px; letter-spacing: .1em; color: #8d8d99; } .tile .v { font-size: 22px; font-weight: 900; }

  /* intro / outro */
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; }
  .big { font-family: 'Barlow Condensed'; font-weight: 900; font-size: 128px; line-height: .9; text-transform: uppercase; }
  .big span { color: var(--red); }
  .sub { font-size: 30px; color: #d9d9e1; max-width: 900px; line-height: 1.3; }
  .three { display: flex; gap: 16px; margin-top: 10px; }
  .three div { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 16px 20px; width: 290px; text-align: left; font-size: 21px; line-height: 1.3; }
  .three b { display: block; font-family: 'Barlow Condensed'; text-transform: uppercase; font-size: 26px; color: var(--gold); letter-spacing: .04em; }
</style>
</head>

// ───── the script: scenes with steps; each step shows a card, highlights its target in the mock and says one caption ─────
const SCENES = [

    { at: 8.5, n: 2, h: 'Líder e intervalo', p: 'O intervalo é para o carro da frente.', cap: 'Líder é o atraso para o primeiro; intervalo é o atraso para o carro da frente. É o intervalo que decide um ataque ou uma defesa.' },

    { at: 24, n: 4, h: 'Sets novos', p: 'Cada paragem risca um conjunto novo.', cap: 'Os sets novos vêm da folha da Pirelli. Cada paragem risca um deles. Quem só tem usados fica com menos opções.' },

    { at: 1.0, n: 1, h: 'Janela de paragem', p: 'Cedo · Janela aberta · Atrasado.', cap: 'A caixa verde é a janela onde os outros costumam parar neste circuito. Cedo, janela aberta ou atrasado.' },

  { id: 'treinos', kick: '07 · fp1, fp2 e fp3', title: 'Treinos livres', len: 30, mock: M.practice, steps: [

    { at: 19.5, n: 3, h: 'Degradação', p: 'Verde baixa, vermelha alta.', cap: 'A degradação diz quem aguenta o pneu. Procura o melhor ritmo com a menor degradação: é o candidato à corrida.' },

    { at: 1.0, n: 1, h: 'Mapa da pista', p: 'Carros em tempo real, curvas e pit lane.', cap: 'O mapa mostra os carros em tempo real sobre o traçado, com as curvas numeradas e a pit lane desenhada.' },
    { at: 11, n: 2, h: 'Gráfico de posições', p: 'Linhas que se cruzam = ultrapassagens.', cap: 'No gráfico, cada linha é um piloto. Quedas bruscas são paragens, e linhas que se cruzam são ultrapassagens.' },
  ] },

  { id: 'play', kick: '09 · os teus pontos', title: 'F1 Play em directo', len: 26, mock: M.play, steps: [
    { at: 1.0, n: 1, h: 'Pontos provisórios', p: 'O teu palpite vs o que acontece agora.', cap: 'Aqui vês os teus pontos em directo: o teu palpite de um lado, o que acontece agora do outro. O total muda a cada volta.' },
    { at: 14, n: 2, h: 'Piloto do Dia', p: 'Botão no topo quando a votação abre.', cap: 'Quando a votação do Piloto do Dia abre, aparece um botão no topo da página. Depois de encerrada, mostra o vencedor.' },

  { id: 'fim', len: 22, outro: true,
    caps: [{ at: 0.6, len: 10, text: 'Os dados são ótimos, mas têm limites: não sabemos o combustível, os modos do motor nem a temperatura real dos pneus.' }, { at: 11.5, len: 10, text: 'Usa a telemetria como uma pista, e combina-a com o que vês na televisão. Há um guia em PDF na página da Telemetria.' }] },

// scene start times
let acc = 0; for (const s of SCENES) { s.start = acc; acc += s.len }
const TOTAL = acc

const root = document.getElementById('root')
for (const s of SCENES) {
  const el = document.createElement('div'); el.className = 'scene'; s.el = el
  if (s.intro) {
    el.innerHTML = `<div class="center"><div class="kick">Beira F1 Fanatics · Temporada 2026</div><div class="big">Como ler a<br><span>Telemetria</span></div><div class="sub">Guia em vídeo, passo a passo</div>
      <div class="three"><div><b>Quem está à frente?</b>Torre, intervalos e mapa</div><div><b>Quem tem ritmo?</b>Pneus e degradação</div><div><b>O que vem a seguir?</b>Estratégia e bandeiras</div></div></div>`
  } else if (s.outro) {
    el.innerHTML = `<div class="center"><div class="big" style="font-size:96px">Tira <span>partido</span><br>da corrida</div><div class="three"><div><b>Antes</b>Grelha, sets novos, previsão de chuva</div><div><b>Durante</b>Bandeira, intervalos, pneus, ritmo</div><div><b>Depois</b>Paragens, posições, Piloto do Dia</div></div><div class="sub" style="font-size:24px;color:#9a9aa8">Guia em PDF e este vídeo: página da Telemetria · app.beiraf1fanatics.com</div></div>`
  } else {
    el.innerHTML = `<div class="top"><span class="kick">${s.kick}</span><span class="ttl">${s.title}</span></div><div class="stage"><div class="mock">${s.mock}</div></div><div class="steps">${s.steps.map(st => `<div class="step"><span class="n">${st.n}</span><div><h4>${st.h}</h4><p>${st.p}</p></div></div>`).join('')}</div>`
    s.stepEls = Array.from(el.querySelectorAll('.step'))
  }
  root.appendChild(el)
}
const TAKES = {
  cabecalho: 'a primeira coisa a olhar é a bandeira e a temperatura da pista.',
  torre: 'não olhes só para a posição: intervalo pequeno com pneus mais novos é uma ameaça.',
  pneus: 'quando o ritmo cai e o pneu já passou da idade habitual, espera uma paragem.',
  estrategia: 'o Safety Car muda tudo: intervalos, janelas de paragem e o custo da box.',
  ritmo: 'um delta enorme, positivo ou negativo, quase sempre é mudança de condições, não de pneu.',
  paragens: 'uma paragem de 4 segundos ou mais muda corridas: confirma a posição na torre.',
  treinos: 'o ritmo de treino é uma pista, não uma verdade: combustível e motor são desconhecidos.',
  mapa: 'se a linha cai e volta a subir, a ultrapassagem foi pela estratégia e não pela pista.',
  play: 'os pontos provisórios mudam até ao fim: só os oficiais contam.',
}
document.fonts.ready.then(() => {
  for (const s of SCENES) {
    if (!TAKES[s.id]) continue
    const d = document.createElement('div'); d.className = 'take'; d.innerHTML = '<b>Em resumo:</b> ' + TAKES[s.id]
    s.el.appendChild(d); s.take = d
    const m = s.el.querySelector('.mock').getBoundingClientRect()
    d.style.top = Math.min(m.bottom + 14, 528) + 'px'
  }
  window.render(window.__t ?? 0)
})
const capEl = document.getElementById('cap'), prog = document.getElementById('prog')
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const ease = x => 1 - Math.pow(1 - x, 3)

window.render = function (t) {
  window.__t = t
  prog.style.width = `${clamp(t / TOTAL) * 100}%`
  let capText = '', capA = 0
  for (const s of SCENES) {
    const local = t - s.start
    const on = local >= 0 && local < s.len
    s.el.style.opacity = on ? String(clamp(local / 0.45) * clamp((s.len - local) / 0.45)) : '0'
    s.el.style.visibility = on ? 'visible' : 'hidden'
    if (!on) continue
    const caps = s.caps ?? (s.steps ?? []).map((st, i) => ({ at: st.at + 0.3, len: ((s.steps[i + 1]?.at ?? s.len - 0.5) - st.at) - 0.4, text: st.cap }))
    for (const c of caps) {
      if (local >= c.at && local < c.at + c.len) { capText = c.text; capA = clamp((local - c.at) / 0.3) * clamp((c.at + c.len - local) / 0.3) }
    }
    if (s.take) { const at = s.steps[s.steps.length - 1].at + 3.5; const p = ease(clamp((local - at) / 0.6)); s.take.style.opacity = String(p); s.take.style.transform = `translateY(${(1 - p) * 14}px)` }
    if (s.steps) {
      let cur = -1
      s.steps.forEach((st, i) => { if (local >= st.at) cur = i })
      s.stepEls.forEach((el, i) => {
        const p = ease(clamp((local - s.steps[i].at) / 0.5))
        el.style.opacity = String(p); el.style.transform = `translateX(${(1 - p) * 40}px)`
        el.classList.toggle('cur', i === cur)
      })
      const hl = cur >= 0 ? String(s.steps[cur].n) : null
      s.el.querySelectorAll('[data-s]').forEach(n => {
        const on2 = hl !== null && n.dataset.s === hl
        n.classList.toggle('hl', on2)
        n.classList.remove('dim')
      })
    }
  }
  capEl.textContent = capText; capEl.style.opacity = String(capA)
}
window.TOTAL = TOTAL
window.render(0)
</script>
